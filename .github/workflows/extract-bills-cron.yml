name: extract-bills-cron
# ★ External cron (ไม่พึ่ง Vercel cron ที่อาจจำกัดความถี่ตาม plan)
#   ยิง endpoint /api/cron/extract-bills ทุก 30 นาที → สกัดบิลใหม่/สเตทเมนต์ + ตัดสินซื้อ/ขาย
#   ต้องตั้ง repo secret: CRON_SECRET (ค่าเดียวกับใน Vercel env)
#
# ★ คุมต้นทุน Gemini: ทุก 30 นาที · limit 20 ใบ/รอบ (≈960 reads/วันตอน backlog · หลังเคลียร์ = แค่บิลใหม่)
#   ★ ตัด mode=reextract ออกจาก auto แล้ว (re-read บิลว่าง/ไม่ครบ ด้วย AI = แพง ส่วนใหญ่อ่านไม่ออกอยู่ดี)
#     ถ้าต้องการ reextract ให้เรียกมือ: gh workflow run / curl "...?mode=reextract" เป็นครั้งคราว
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: extract-bills-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: extract + redecide
        run: |
          curl -sS -m 300 \
            -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://nova-cx.vercel.app/api/cron/extract-bills?mode=both&limit=20" || true
